# Local development database only. Run the API itself with uvicorn (see README).
services:
  db:
    image: mariadb:11
    container_name: expense-db
    restart: unless-stopped
    # utf8mb4 so Arabic text (descriptions, names) is stored correctly.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: expense_db
      MARIADB_USER: expense
      MARIADB_PASSWORD: expense
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
