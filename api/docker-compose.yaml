services:
  db:
    image: mysql
    container_name: masroof-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: masroof
      MYSQL_USER: masroof
      MYSQL_PASSWORD: my_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
